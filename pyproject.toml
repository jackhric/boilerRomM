[project]
name = "chickentender"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["aiohttp", "pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py_modules", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
extend-exclude = ["py_modules/yt_dlp", "py_modules/yt_dlp-*", "decky.pyi"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
